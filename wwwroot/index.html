<!DOCTYPE html>
<html lang="en">
<head>
    <title>GuacWS Server</title>
    <meta name="author" content="https://glokon.me">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:200,700" rel="stylesheet" type="text/css">
    <style>
        .content {
            width: 850px;
            height: 200px;
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            margin: auto;
            max-width: 100%;
            max-height: 100%;
            overflow: auto;
            text-align: center;
        }

        .text {
            font-family: 'Montserrat',sans-serif;
            font-weight: 700;
            font-size: 100px;
            line-height: 130px;
        }

        .small-text {
            font-family: 'Montserrat',sans-serif;
            font-weight: 200;
            font-size: 20px;
            line-height: 20px;
        }
    </style>
</head>
<body>
    <div class="content">
        <span class="text">GuacWS Server</span><br />
        <span class="small-text">Please connect using WebSockets</span>
    </div>
</body>
</html>
