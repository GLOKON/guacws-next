plugins:
  - "@semantic-release/commit-analyzer"
  - "@semantic-release/release-notes-generator"
  - - "@codedependant/semantic-release-docker"
    - dockerLogin: false
  - "@semantic-release/github"
branches:
  - "main"
  - "+([0-9])?(.{+([0-9]),x}).x"
  - name: "alpha"
    prerelease: "alpha"
  - name: "beta"
    prerelease: "beta"
