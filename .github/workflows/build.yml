name: Build and Package
on:
  push:
    branches-ignore:
      - main
      - alpha
      - beta
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-server:
    name: Build Server
    uses: ./.github/workflows/build-server.yml
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            docker: true
            dockerPlatform: linux/amd64
    with:
      branch: ${{ github.ref_name }}
      operatingSystem: ${{ matrix.os }}
      buildRuntime: ${{ matrix.rid }}
      tag: "v0.0.0"
      version: "0.0.0"
      publish: false
      docker: ${{ matrix.docker }}
      dockerImage: ${{ github.repository }}
      dockerPlatform: ${{ matrix.dockerPlatform }}