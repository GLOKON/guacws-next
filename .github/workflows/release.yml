name: Test and Release
on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
jobs:
  build-all:
    strategy:
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, linux-musl-x64, linux-musl-arm64]
    runs-on: ubuntu-latest
    steps:
    - name: Build Server (${{ matrix.rid }})
      run: dotnet publish -r ${{ matrix.rid }} -o ./dist/${{ matrix.rid }} -c Release ./GLOKON.GuacWS.Server.csproj
    - name: Upload artifacts
      uses: actions/upload-artifact@v2
      with:
        name: ${{ matrix.rid }}
        path: dist/${{ matrix.rid }}
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Store Image Name
      run: |
        echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 'lts/*'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'
    - uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '7.0.x'
        cache: true
    - name: Install dependencies
      run: npx ci
    - name: Build Server for Container
      run: dotnet publish -r linux-musl-x64 -o ./dist -c Release ./GLOKON.GuacWS.Server.csproj
    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
    - name: Login to DockerHub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Release
      if: github.event_name != 'pull_request'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: npx semantic-release
