name: Build and Release
on:
  push:
    branches:
      - main
      - beta
      - alpha
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  id-token: write
  issues: write
  contents: write
  pull-requests: write
jobs:
  build_and_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Release
        id: release-next-version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
      - name: Show Version
        run: echo "Next version is ${{ steps.release-next-version.outputs.new-release-version }} (${{ github.ref_name }})"
    outputs:
      published: ${{ steps.release-next-version.outputs.new-release-published }}
      version: ${{ steps.release-next-version.outputs.new-release-version }}
      tag: ${{ steps.release-next-version.outputs.new-release-git-tag }}

  build-server:
    name: Build Server
    uses: ./.github/workflows/build-server.yml
    needs:
      - build_and_release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: win-x64
            docker: false
            dockerPlatform: windows/amd64
          - os: ubuntu-latest
            rid: win-arm64
            docker: false
            dockerPlatform: windows/arm64
          - os: ubuntu-latest
            rid: linux-x64
            docker: true
            dockerPlatform: linux/amd64
          - os: ubuntu-latest
            rid: linux-arm64
            docker: true
            dockerPlatform: linux/arm64
    with:
      branch: ${{ github.ref_name }}
      operatingSystem: ${{ matrix.os }}
      buildRuntime: ${{ matrix.rid }}
      docker: ${{ matrix.docker }}
      dockerImage: ${{ vars.DOCKER_IMAGE }}
      dockerPlatform: ${{ matrix.dockerPlatform }}
      publish: ${{ contains(fromJSON('["main", "beta", "alpha"]'), github.ref_name) }}
      tag: ${{ needs.build_and_release.outputs.tag }}
      version: ${{ needs.build_and_release.outputs.version }}
      awsBucketRegion: ${{ vars.AWS_BUCKET_REGION }}
      awsBucket: ${{ vars.AWS_BUCKET }}
    secrets:
      awsRole: ${{ vars.AWS_ROLE }}
      dockerHubUsername: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerHubPassword: ${{ secrets.DOCKERHUB_TOKEN }}
      token: ${{ secrets.GITHUB_TOKEN }}

  merge:
    runs-on: ubuntu-latest
    needs:
      - build_and_release
      - build-server
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ vars.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}},value=${{ needs.build_and_release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.build_and_release.outputs.tag }}
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ vars.DOCKER_IMAGE }}@sha256:%s ' *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ vars.DOCKER_IMAGE }}:${{ steps.meta.outputs.version }}